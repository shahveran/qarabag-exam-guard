<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <title>Qarabağ Universiteti — UEF Proctoring Integration</title>
</head>
<body>
  <script>
    /**
     * 🛡️ QARABAĞ UNİVERSİTETİ — BLACKBOARD ULTRA PROCTORING EXTENSION (UEF)
     * Rəsmi IMS LTI 1.3 və Blackboard Ultra Extension Framework (UEF) əsasında.
     */
    (function () {
      console.log("[Qarabag Proctoring] UEF Modulu işə düşdü.");

      var integrationId = '88fd854e-3e92-42da-b58e-8170ad7ec21d';

      // 1. Blackboard Ultra Host Pəncərəsi ilə Əlaqə (Handshake)
      function initUEF() {
        window.parent.postMessage({
          type: 'authorization:authorize',
          data: {
            token: 'qu_uef_token_' + Date.now()
          }
        }, '*');
      }

      // 2. Blackboard Hadisələrini Dinləmək
      window.addEventListener('message', function (event) {
        if (!event.data) return;

        var msg = event.data;

        // A) Blackboard UEF icazə təsdiqi verdi
        if (msg.type === 'authorization:authorized') {
          console.log("[Qarabag Proctoring] Blackboard ilə təhlükəsiz kanal yaradıldı!");

          // İmtahan hadisələrinə (attempt:started, route-change) abunə oluruq
          window.parent.postMessage({
            type: 'event:subscribe',
            data: {
              types: [
                'portal:route-change',
                'event:assessment:attempt:started',
                'event:assessment:attempt:submitted'
              ]
            }
          }, '*');
        }

        // B) Tələbə İmtahana Başlayanda (assessment:attempt:started)
        if (msg.type === 'event:assessment:attempt:started' || 
           (msg.type === 'portal:route-change' && msg.data && msg.data.routeData && 
           (msg.data.routeData.path.indexOf('/assessment/') !== -1 || msg.data.routeData.path.indexOf('/test/') !== -1))) {
          
          console.warn("[Qarabag Proctoring] Tələbə imtahana daxil oldu! Qoruma aktivləşdirilir.");
          
          // Blackboard Ultra ekranına rəsmi Təhlükəsizlik Bildirişi çıxarırıq
          window.parent.postMessage({
            type: 'portal:notification',
            data: {
              status: 'warning',
              message: '🛡️ QARABAĞ UNİVERSİTETİ: Bu imtahan aktiv monitorinq altındadır! Başqa pəncərəyə keçmək və AI istifadəsi qadağandır.'
            }
          }, '*');

          // Brauzer fokusunun itməsini (Alt+Tab) dinləməyə başlayırıq
          startStudentMonitoring();
        }
      });

      // 3. Tələbənin Ekrandan Çıxış Nəzarəti (Monitorinq)
      var strikes = 0;
      var MAX_STRIKES = 3;
      var lastAlertTime = 0;

      function startStudentMonitoring() {
        // Tələbə pəncərədən çıxanda (Alt+Tab, başqa tab)
        window.addEventListener('blur', recordViolation);
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) recordViolation();
        });
      }

      function recordViolation() {
        var now = Date.now();
        if (now - lastAlertTime < 2000) return;
        lastAlertTime = now;
        strikes++;

        if (strikes >= MAX_STRIKES) {
          // 3-cü pozuntuda Blackboard-a imtahanı bağlamağı əmr edirik
          window.parent.postMessage({
            type: 'portal:modal',
            data: {
              title: '🚫 İmtahan Dayandırıldı!',
              body: 'İcazə verilən pəncərədən çıxış limitini (3/3) keçdiyiniz üçün imtahanınız sonlandırıldı!'
            }
          }, '*');
        } else {
          // Xəbərdarlıq modalı
          window.parent.postMessage({
            type: 'portal:notification',
            data: {
              status: 'error',
              message: '⚠️ QAYDA POZUNTUSU (' + strikes + '/' + MAX_STRIKES + '): İmtahan pəncərəsindən kənara çıxdınız!'
            }
          }, '*');
        }
      }

      // Başlat
      initUEF();
    })();
  </script>
</body>
</html>
